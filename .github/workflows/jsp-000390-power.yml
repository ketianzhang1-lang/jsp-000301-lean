name: JSP-000390 power-family verification
on:
  push:
    branches: [jsp-000390-power-family]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: projects/jsp-000390-minus-one
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Fetch locked Mathlib dependencies and official cache
        run: lake exe cache get
      - name: Build both modules, replay kernels and audit actual theorem dependencies
        run: bash scripts/verify_power.sh
      - name: Independent NaNoda check of both families with strict standard axioms
        run: bash scripts/verify_power_nanoda.sh 2>&1 | tee evidence/power-nanoda-build.log
      - name: Archive exact source and dependency pins
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/SOURCE_COMMIT
          git diff --exit-code -- lake-manifest.json
          tar --exclude=.lake --exclude=evidence -czf evidence/source.tar.gz .
          sha256sum evidence/source.tar.gz > evidence/ARCHIVE_SHA256
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jsp-000390-power-family-evidence
          path: projects/jsp-000390-minus-one/evidence
          if-no-files-found: error
