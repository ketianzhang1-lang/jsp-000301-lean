name: JSP-000465 supplementary theorem verification
on:
  push:
    branches: [jsp-000465-uniform-ratios-20260919]
    paths: [projects/jsp-000465/**, .github/workflows/jsp-000465-supplement.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
        working-directory: projects/jsp-000465
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact toolchain and locked dependency cache
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          git diff --exit-code -- lake-manifest.json
      - name: Full original proof and new supplement checks
        run: python3 scripts/verify_supplement.py
      - name: Strict independent checker for original and new theorem closures
        run: |
          set -euo pipefail
          bash scripts/verify_supplement_nanoda.sh 2>&1 | tee evidence/supplement/nanoda-build.log
      - name: Archive exact tested source
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/supplement
          git rev-parse HEAD > evidence/supplement/SOURCE_COMMIT
          git -C ../.. archive HEAD projects/jsp-000465 .github/workflows/jsp-000465-supplement.yml | gzip -n > evidence/supplement/source.tar.gz
          sha256sum evidence/supplement/source.tar.gz > evidence/supplement/SOURCE_ARCHIVE_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jsp-000465-supplement-evidence
          path: projects/jsp-000465/evidence
          if-no-files-found: error
