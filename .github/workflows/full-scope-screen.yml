name: Full scope source screening
on:
  push:
    branches: ["research/full-scope-20260917-0900"]
    paths: [".github/workflows/full-scope-screen.yml"]
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare primary-source snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --quiet pyyaml
          mkdir -p screen/awards screen/erdos
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.request, yaml
          P=pathlib.Path('screen')
          def fetch(url):
              headers={'User-Agent':'JSP-full-scope-research'}
              if url.startswith('https://api.github.com/'):
                  headers['Authorization']='Bearer '+os.environ['GH_TOKEN']
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as f:
                  return f.read().decode()
          sha=json.loads(fetch('https://api.github.com/repos/plby/lean-proofs/commits/main'))['sha']
          tree=json.loads(fetch(f'https://api.github.com/repos/plby/lean-proofs/git/trees/{sha}?recursive=1'))
          assert not tree.get('truncated'), 'Refusing truncated tree'
          (P/'plby_tree.json').write_text(json.dumps(tree))
          paths={x['path'] for x in tree['tree']}
          ts=json.loads(fetch('https://api.github.com/repos/teorth/erdosproblems/commits/main'))['sha']
          raw=fetch(f'https://raw.githubusercontent.com/teorth/erdosproblems/{ts}/data/problems.yaml')
          (P/'erdos/problems.yaml').write_text(raw)
          data=yaml.safe_load(raw)
          print('SNAPSHOTS', 'plby',sha,'erdos',ts)
          missing=[]
          for p in data:
              state=p.get('informal_status',{}).get('state','')
              fstate=p.get('formal_status',{}).get('state','')
              n=p['number']
              if state in ['proved','disproved','solved'] and fstate!='Lean':
                  fname=f'src/latest/ErdosProblems/Erdos{n}.lean'
                  if fname not in paths:
                      missing.append(p)
          (P/'missing.json').write_text(json.dumps(missing,indent=2))
          print('SOLVED WITHOUT LEAN FILE:',len(missing))
          for p in missing: print(json.dumps(p))
          awards=json.loads(fetch('https://api.github.com/repos/TheJustinSunPrize/awards/commits/main'))['sha']
          catalog=json.loads(fetch(f'https://api.github.com/repos/TheJustinSunPrize/awards/contents/problems?ref={awards}'))
          for e in catalog:
              if e['name'].endswith('.md'):
                  (P/'awards'/e['name']).write_text(fetch(e['download_url']))
          print('awards',awards)
          (P/'SNAPSHOTS.json').write_text(json.dumps({'plby':sha,'erdos':ts,'awards':awards},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-scope-screening-sources
          path: screen
          if-no-files-found: error
