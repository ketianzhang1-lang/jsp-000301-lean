name: JSP-000924 fourth-power Sierpinski family
on:
  push:
    branches: [jsp-000924-fourth-powers]
    paths: [projects/jsp-000924/**, .github/workflows/jsp-000924.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: projects/jsp-000924
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install exact toolchain and locked dependencies
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          if [ ! -f lake-manifest.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('../../lake-manifest.json').read_text())
          d['name']='JSP000924'
          Path('lake-manifest.json').write_text(json.dumps(d,indent=2)+'\n')
          PY
          fi
          lake exe cache get
      - name: Build actual quantified proof and replay kernel
        run: |
          set -euo pipefail
          mkdir -p evidence
          lake build --wfail 2>&1 | tee evidence/build.log
          lake env leanchecker JSP000924 2>&1 | tee evidence/leanchecker.log
          lake env lean Audit.lean 2>&1 | tee evidence/axioms.log
          python3 - <<'PY'
          import re,json,subprocess
          from pathlib import Path
          names=re.findall(r'^#print axioms (\S+)',Path('Audit.lean').read_text(),re.M)
          assert len(names)==6
          log=Path('evidence/axioms.log').read_text()
          for name in names:
              m=re.search("'"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",log)
              assert m is not None,name
              assert {x.strip() for x in m[1].split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'},name
          for pkg in json.loads(Path('lake-manifest.json').read_text())['packages']:
              assert subprocess.check_output(['git','-C','.lake/packages/'+pkg['name'],'rev-parse','HEAD'],text=True).strip()==pkg['rev']
          print('All six axiom audits and actual locked revisions passed.')
          PY
      - name: Archive tested source and logs
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/SOURCE_COMMIT
          cp lake-manifest.json evidence/
          tar --exclude=.lake --exclude=evidence -czf evidence/source.tar.gz .
          sha256sum evidence/source.tar.gz > evidence/ARCHIVE_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jsp-000924-evidence
          path: projects/jsp-000924/evidence
          if-no-files-found: error
