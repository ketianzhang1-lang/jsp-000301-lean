name: JSP-000399 exceptional 27-element triple sums
on:
  push:
    branches: [jsp-000399-triple-27]
    paths: [projects/jsp-000399-27/**, .github/workflows/jsp-000399-27.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: projects/jsp-000399-27
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned compiler and dependencies
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          git diff --exit-code -- lake-manifest.json
      - name: Compile and audit
        run: |
          set -euo pipefail
          mkdir -p evidence
          lake build --wfail 2>&1 | tee evidence/build.log
          lake env lean Audit.lean 2>&1 | tee evidence/axioms.log
          lake env leanchecker Adapter 2>&1 | tee evidence/kernel-adapter.log
          lake env leanchecker JSP000399Triple 2>&1 | tee evidence/kernel-main.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jsp-000399-27-evidence
          path: projects/jsp-000399-27/evidence
          if-no-files-found: warn
