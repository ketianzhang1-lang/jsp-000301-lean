name: Research actual theorem scope
on:
  push:
    branches: [research-fullscope-20260917]
    paths: ['.github/workflows/research-source-scope.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download main public source modules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source-scope
          python3 - <<'PY'
          import urllib.request,json,pathlib,re,concurrent.futures,time,os
          rev='8822f7ddef30fadbd92e1c6ab4ed897af356af5e'
          req=urllib.request.Request('https://api.github.com/repos/plby/lean-proofs/git/trees/'+rev+'?recursive=1',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'scope-audit'})
          tree=json.load(urllib.request.urlopen(req))['tree']
          paths=[x['path'] for x in tree if re.fullmatch(r'src/latest/ErdosProblems/Erdos\d+\.lean',x['path'])]
          def one(p):
              url='https://raw.githubusercontent.com/plby/lean-proofs/'+rev+'/'+p
              for i in range(4):
                  try:
                      data=urllib.request.urlopen(url,timeout=60).read()
                      pathlib.Path('source-scope',pathlib.PurePosixPath(p).name).write_bytes(data)
                      return len(data)
                  except Exception:
                      if i==3:raise
                      time.sleep(2)
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              sizes=list(ex.map(one,paths))
          print('Downloaded',len(sizes),'source modules;',sum(sizes),'bytes. Not a proof verification.')
          pathlib.Path('source-scope/REVISION').write_text(rev+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: existing-main-sources
          path: source-scope
