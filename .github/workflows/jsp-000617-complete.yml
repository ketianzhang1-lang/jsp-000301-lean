name: JSP-000617 upper-density verification
on:
  push:
    branches: [jsp-000617-complete-prep]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upper-density:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: projects/jsp-000617
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Fetch locked dependency cache
        run: lake exe cache get
      - name: Compile final theorem and audit all axioms
        run: bash scripts/verify.sh
      - name: Independent Nanoda verification of final theorem
        run: |
          set -euo pipefail
          bash scripts/verify_nanoda.sh 2>&1 | tee evidence/nanoda-build.log
      - name: Preserve exact source and evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/SOURCE_COMMIT
          git diff --exit-code -- lake-manifest.json
          tar --exclude=.lake --exclude=evidence --exclude='*.olean*' --exclude='*.ilean' --exclude='*.ir' -czf evidence/source.tar.gz .
          sha256sum evidence/source.tar.gz > evidence/SHA256SUMS
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jsp-000617-upper-density-evidence
          path: projects/jsp-000617/evidence
          if-no-files-found: error
