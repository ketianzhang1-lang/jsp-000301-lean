name: Full-scope research screening
on:
  push:
    branches: [research-fullscope-20260917]
    paths: ['.github/workflows/research-fullscope.yml']
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gather public problem and submission snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research-data
          python3 - <<'PY'
          import urllib.request, json, pathlib, re, os, datetime
          out=pathlib.Path('research-data')
          def get(url):
              h={'User-Agent':'JSP-public-scope-research'}
              if url.startswith('https://api.github.com/'):
                  h['Authorization']='Bearer '+os.environ['GH_TOKEN']
              return urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=60).read()
          base='https://raw.githubusercontent.com/TheJustinSunPrize/awards/main/problems/'
          index=get(base+'README.md').decode(); (out/'index.md').write_text(index)
          paths=sorted(set(re.findall(r'catalog-[0-9]+-[0-9]+\.md',index)))
          records=[]
          for p in paths:
              text=get(base+p).decode(); (out/p).write_text(text)
              for block in re.split(r'(?=\n## JSP-)',text):
                  m=re.search(r'## (JSP-\d+) · (.+)',block)
                  if m: records.append({'id':m[1],'title':m[2],'body':block})
          issues=[]
          for page in range(1,20):
              arr=json.loads(get(f'https://api.github.com/repos/TheJustinSunPrize/awards/issues?state=all&per_page=100&page={page}'))
              issues.extend(arr)
              if len(arr)<100:break
          (out/'issues.json').write_text(json.dumps(issues,ensure_ascii=False,indent=2))
          (out/'catalog.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          for name,url in [('erdos.yaml','https://raw.githubusercontent.com/teorth/erdosproblems/main/data/problems.yaml'),('plby-tree.json','https://api.github.com/repos/plby/lean-proofs/git/trees/8822f7ddef30fadbd92e1c6ab4ed897af356af5e?recursive=1')]:
              (out/name).write_bytes(get(url))
          mentioned={m for x in issues for m in re.findall(r'JSP-\d{6}',x.get('title','')+' '+(x.get('body') or ''))}
          candidates=[r for r in records if re.search(r'\| Current status \| Solved',r['body']) and re.search(r'\| Lean proof \| No',r['body']) and r['id'] not in mentioned]
          report='Public snapshot: '+datetime.datetime.now(datetime.timezone.utc).isoformat()+'\n'
          report+=f'Catalog records: {len(records)}; issue/PR records: {len(issues)}; candidates without exact JSP mention: {len(candidates)}\n'
          report+='Not a worldwide priority or scope certification.\n\n'
          report+='\n'.join(r['id']+' '+r['title'] for r in candidates)
          (out/'candidates.txt').write_text(report)
          print(report)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-scope-research
          path: research-data
