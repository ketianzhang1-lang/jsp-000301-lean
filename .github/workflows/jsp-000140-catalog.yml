name: JSP-000140 catalog reference verification
on:
  push:
    branches: [jsp-000140-coloring-kz]
    paths: [.github/workflows/jsp-000140-catalog.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ketianzhang1-lang/awards
          ref: 2ca46f6a0224f031e5c6914d6f213ab6ffaf6082
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify the exact catalog revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2ca46f6a0224f031e5c6914d6f213ab6ffaf6082"
          test "$(git diff --name-only ff33abd13163e789790eb1014e55f57c05f94432 HEAD)" = "problems/catalog-0101-0200.md"
          python -m pip install -r requirements.txt
      - name: Run public catalog checks and tests
        run: |
          set -euo pipefail
          python scripts/manage.py validate
          python scripts/manage.py links
          python scripts/manage.py build
          python scripts/manage.py check
          python scripts/manage.py history --base ff33abd13163e789790eb1014e55f57c05f94432
          python -m unittest discover -s tests -v
          git diff --exit-code
      - name: Clarify verification scope
        run: |
          echo "These are contributor-run checks of public catalog content."
          echo "They do not approve or bypass the upstream PR workflow approval requirement."
