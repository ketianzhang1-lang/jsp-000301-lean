name: JSP-000393 complete proof verification
on:
  push:
    branches: [jsp-000393-sparse-squares]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jsp-000393-complete-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Replay memory allowance
        run: |
          sudo fallocate -l 8G /swapfile-jsp393
          sudo chmod 600 /swapfile-jsp393
          sudo mkswap /swapfile-jsp393
          sudo swapon /swapfile-jsp393
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Fetch and hash-check full upstream proof
        run: python3 scripts/bootstrap.py
      - name: Fetch pinned Mathlib cache
        run: |
          lake exe cache get Mathlib
          lake build Mathlib
      - name: Compile, replay and audit complete proof
        run: python3 scripts/verify_complete.py
      - name: Record source revision
        if: always()
        run: |
          mkdir -p evidence-complete
          git rev-parse HEAD > evidence-complete/SOURCE_COMMIT
          cp lean-toolchain lake-manifest.json UPSTREAM.json SOURCE_SHA256SUMS evidence-complete/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jsp-000393-complete-verification
          path: evidence-complete
          if-no-files-found: error
          retention-days: 90
