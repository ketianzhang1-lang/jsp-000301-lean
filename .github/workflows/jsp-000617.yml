name: JSP-000617 development checks
on:
  push:
    branches: [jsp-000617-upper-density]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: projects/jsp-000617
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read public original-proof sources without executing them
        run: |
          python3 scripts/source_links.py
          python3 scripts/read_public_paper.py
      - name: Install fixed Lean and use locked dependencies
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Fetch dependency cache
        run: lake exe cache get
      - name: Compile and audit finite construction (not infinite density theorem)
        run: bash scripts/verify.sh
      - name: Independently check the finite theorem and complete dependencies
        run: |
          set -euo pipefail
          bash scripts/verify_nanoda.sh 2>&1 | tee evidence/nanoda-build.log
      - name: Preserve development snapshot
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/SOURCE_COMMIT
          git diff --exit-code -- lake-manifest.json
          tar --exclude=.lake --exclude=evidence -czf evidence/source.tar.gz .
          sha256sum evidence/source.tar.gz > evidence/SHA256SUMS
      - name: Upload development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jsp-000617-development-evidence
          path: projects/jsp-000617/evidence
          if-no-files-found: error
