name: JSP-000506 complete proof preparation
on:
  push:
    branches: [jsp-000506-complete-kz]
    paths: [projects/jsp-000506/**, .github/workflows/jsp-000506-complete.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: projects/jsp-000506
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Provide swap for complete-source checking
        working-directory: /tmp
        run: |
          sudo fallocate -l 8G /swap-jsp506
          sudo chmod 600 /swap-jsp506
          sudo mkswap /swap-jsp506
          sudo swapon /swap-jsp506
      - name: Install pinned toolchain and dependencies
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          python3 scripts/bootstrap.py
          lake exe cache get Mathlib
          lake build Mathlib
          git diff --exit-code -- lake-manifest.json
      - name: Archive exact public Mathlib cache objects
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PYCODE'
          from pathlib import Path
          import json,subprocess
          for p in json.loads(Path('lake-manifest.json').read_text())['packages']:
              d=Path('.lake/packages')/p['name']
              assert subprocess.check_output(['git','-C',str(d),'rev-parse','HEAD'],text=True).strip()==p['rev']
          cache=Path.home()/'.cache/mathlib'
          paths=sorted(p.name for p in cache.glob('*.ltar'))
          assert len(paths)>=8500
          Path('evidence/cache-files.txt').write_text('\n'.join(paths)+'\n')
          listing=Path('evidence/cache-files.txt').resolve()
          subprocess.run(['tar','-I','zstd -T2 -3','-cf','evidence/mathlib-431-objects.tar.zst','-C',str(cache),'-T',str(listing)],check=True)
          PYCODE
          sha256sum evidence/mathlib-431-objects.tar.zst > evidence/CACHE_SHA256
          cp lake-manifest.json evidence/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jsp-000506-public-cache-objects
          path: projects/jsp-000506/evidence
          compression-level: 0
          retention-days: 3
