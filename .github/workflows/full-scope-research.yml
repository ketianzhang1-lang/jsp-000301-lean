name: Full-scope research screening
on:
  push:
    branches: [research/new-full-scope-20260917]
    paths:
      - .github/workflows/full-scope-research.yml
      - research/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read public catalogue and submissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research-output
          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          out = Path('research-output')
          def read(url):
              headers = {'User-Agent': 'full-scope-research'}
              if url.startswith('https://api.github.com/'):
                  headers['Authorization'] = 'Bearer ' + os.environ['GH_TOKEN']
              return urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=45).read()
          def api(path): return json.loads(read('https://api.github.com/' + path))
          root = 'TheJustinSunPrize/awards'
          branch = api('repos/' + root + '/commits/main')['sha']
          print('Catalogue commit:', branch)
          index = read('https://raw.githubusercontent.com/' + root + '/' + branch + '/problems/README.md').decode()
          (out/'index.md').write_text(index)
          issues = []
          for page in range(1, 30):
              batch = api(f'repos/{root}/issues?state=all&per_page=100&page={page}')
              issues.extend(batch)
              if len(batch) < 100: break
          (out/'issues.json').write_text(json.dumps(issues, ensure_ascii=False, indent=2))
          text = '\n'.join((i.get('title') or '') + '\n' + (i.get('body') or '') for i in issues)
          print('Issue/PR records:', len(issues))
          mentioned = set(re.findall(r'JSP[- ]?(\d{6})', text, re.I))
          print('Distinct catalogue identifiers mentioned:', len(mentioned))
          candidates=[]
          for line in index.splitlines():
              m = re.match(r'\| JSP-(\d{6}) \|', line)
              if m and m[1] not in mentioned and '| Solved' in line and '| No | No |' in line:
                  candidates.append((m[1],line))
                  print(line)
          print('UNMENTIONED SOLVED LEAN-NO:', len(candidates))
          details=[]
          for name in re.findall(r'\]\((catalog-[0-9-]+\.md)\)', index):
              if name in details: continue
              details.append(name)
          allcat=''
          for name in details:
              cat=read('https://raw.githubusercontent.com/'+root+'/'+branch+'/problems/'+name).decode()
              (out/name).write_text(cat)
              allcat += cat+'\n'
          chosen=[]
          for ident,line in candidates:
              m=re.search(r'## JSP-'+ident+r'\b[\s\S]*?(?=\n<a id="JSP-|\Z)',allcat)
              if m: chosen.append(m[0])
          (out/'candidate-details.md').write_text('\n\n'.join(chosen))
          (out/'screening.json').write_text(json.dumps({'catalogue_commit':branch,'issue_count':len(issues),'mentioned':sorted(mentioned),'candidate_ids':[x[0] for x in candidates]},indent=2))
          # Public reference tree, not a verification or originality claim.
          try:
              info=api('repos/plby/lean-proofs')
              tree=api('repos/plby/lean-proofs/git/trees/'+info['default_branch']+'?recursive=1')
              (out/'plby-tree.json').write_text(json.dumps(tree,indent=2))
              print('Prior library tree entries:',len(tree.get('tree',[])),'truncated:',tree.get('truncated'))
          except Exception as e: print('Prior-library tree unavailable:',str(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-scope-screening
          path: research-output/
          if-no-files-found: error
