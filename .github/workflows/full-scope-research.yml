name: Full-scope source audit (not a proof)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Collect public source snapshots only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p research-output
          printf '%s\n' 'SOURCE AUDIT ONLY. A successful run does not verify a mathematical theorem or establish novelty, full scope, eligibility, or an award.' > research-output/STATUS.txt
          curl -fsSL 'https://raw.githubusercontent.com/teorth/erdosproblems/main/data/problems.yaml' -o research-output/erdos-status.yaml
          curl -fsSL 'https://raw.githubusercontent.com/TheJustinSunPrize/awards/main/problems/README.md' -o research-output/jsp-index.md
          curl -fsSL 'https://codeload.github.com/google-deepmind/formal-conjectures/tar.gz/refs/heads/main' -o research-output/formal-conjectures.tar.gz
          curl -fsSL 'https://raw.githubusercontent.com/teorth/erdosproblems/main/README.md' -o research-output/erdos-index.md
          curl -fsSL 'https://codeload.github.com/plby/lean-proofs/tar.gz/refs/heads/main' -o research-output/existing-lean-proofs.tar.gz
          gh api --paginate 'repos/TheJustinSunPrize/awards/issues?state=all&per_page=100' --jq '.[]' | jq -s . > research-output/existing-submissions.json
          sha256sum research-output/* > research-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: full-scope-source-audit-not-a-proof
          path: research-output/
          if-no-files-found: error
