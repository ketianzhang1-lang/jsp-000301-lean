name: JSP-000912 complete divisor-gap proof
on:
  push:
    branches: [jsp-000912-complete-proof]
    paths: [projects/jsp-000912/**, .github/workflows/jsp-000912.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: projects/jsp-000912
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned toolchain and locked dependencies
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          git diff --exit-code -- lake-manifest.json
      - name: Build both layouts, replay, audit and negative control
        run: bash scripts/verify.sh
      - name: Independent NaNoda verification
        run: |
          set -euo pipefail
          bash scripts/verify_nanoda.sh 2>&1 | tee evidence/current/nanoda-build.log
      - name: Archive checked source and evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence/current
          git rev-parse HEAD > evidence/current/SOURCE_COMMIT
          cp lake-manifest.json evidence/current/
          git diff --exit-code -- lake-manifest.json
          tar --exclude=.lake --exclude=evidence -czf evidence/current/source.tar.gz .
          sha256sum evidence/current/source.tar.gz > evidence/current/ARCHIVE_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jsp-000912-verification
          path: projects/jsp-000912/evidence/current
          retention-days: 90
          if-no-files-found: error
