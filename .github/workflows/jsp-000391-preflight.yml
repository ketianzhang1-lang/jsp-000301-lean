name: JSP-000391 submission preflight
on:
  push:
    branches: [awards-preflight-jsp000391]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact proposed submission
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ketianzhang1-lang/awards
          ref: 8d5b80f51a4df0b010fe7e6a079dcc5cdfab0b00
          path: awards
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout successfully verified proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ketianzhang1-lang/jsp-000301-lean
          ref: 56f083c6183e93eeffc334e04e39a26548bfae96
          path: proof
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install official validation dependencies
        run: python -m pip install -r awards/requirements.txt
      - name: Verify source identity, recorded hashes and isolated change scope
        run: |
          set -euo pipefail
          mkdir -p evidence
          rel=docs/submissions/jsp-000391-kz
          p=awards/$rel
          for f in JSP000391.lean JSP000391Main.lean Audit.lean lakefile.lean lean-toolchain lake-manifest.json LICENSE; do
            cmp "$p/$f" "proof/projects/jsp-000391/$f"
          done
          (cd "$p" && sha256sum -c SOURCE_SHA256SUMS) | tee evidence/source-checks.log
          (cd "$p" && printf '%s\n' '083a53f952d332c4405a944d1f3b959cbdd7259788776987387092f553c0fa36  evidence/axioms.log' '9af89b6be64e67a2ab0d21e722ddf7265f149c1c5152496088ddfeda96c1cacd  evidence/nanoda.log' | sha256sum -c -) | tee evidence/log-checks.log
          python - <<'PY'
          import subprocess
          changes = subprocess.check_output(['git','-C','awards','diff','--name-status',
              'f4e7173d89dfe91022a185427d63452c8ffbf6ae','HEAD'],text=True).splitlines()
          assert len(changes) == 12, changes
          assert all(x.startswith('A\tdocs/submissions/jsp-000391-kz/') for x in changes), changes
          print('Exactly 12 new files in the new intake directory; no other records changed.')
          PY
          git -C awards diff --check f4e7173d89dfe91022a185427d63452c8ffbf6ae HEAD
          git -C awards diff --stat f4e7173d89dfe91022a185427d63452c8ffbf6ae HEAD > evidence/diff-stat.txt
          git -C awards diff f4e7173d89dfe91022a185427d63452c8ffbf6ae HEAD > evidence/submission.patch
          git -C awards archive HEAD "$rel" | gzip -n > evidence/submission.tar.gz
          sha256sum evidence/submission.tar.gz > evidence/SHA256SUMS
          git -C awards rev-parse HEAD > evidence/SUBMISSION_COMMIT
      - name: Validate official schemas and local links
        run: |
          set -euo pipefail
          cd awards
          python scripts/manage.py validate 2>&1 | tee ../evidence/validate.log
          python scripts/manage.py links 2>&1 | tee ../evidence/links.log
      - name: Regenerate indexes and verify unchanged official data
        run: |
          set -euo pipefail
          cd awards
          python scripts/manage.py build 2>&1 | tee ../evidence/build-data.log
          python scripts/manage.py check 2>&1 | tee ../evidence/check-data.log
          git diff --exit-code -- data
      - name: Check immutable history and run all official tests
        run: |
          set -euo pipefail
          cd awards
          python scripts/manage.py history --base f4e7173d89dfe91022a185427d63452c8ffbf6ae 2>&1 | tee ../evidence/history.log
          python -m unittest discover -s tests -v 2>&1 | tee ../evidence/tests.log
      - name: Upload exact preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jsp-000391-preflight-evidence
          path: evidence
          if-no-files-found: error
