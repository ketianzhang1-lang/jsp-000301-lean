name: JSP-000506 joint gaps, conditioning and mean-gap supplement
on:
  push:
    branches: [jsp-000506-selection-20260919]
    paths: [projects/jsp-000506/**, .github/workflows/jsp-000506-selection.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: projects/jsp-000506
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Provide swap for kernel replay
        working-directory: /tmp
        run: |
          sudo fallocate -l 8G /swap-jsp506-selection
          sudo chmod 600 /swap-jsp506-selection
          sudo mkswap /swap-jsp506-selection
          sudo swapon /swap-jsp506-selection
      - name: Install exact toolchain and locked dependencies
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          python3 scripts/bootstrap.py
          lake exe cache get Mathlib
          lake build Mathlib
          git diff --exit-code -- lake-manifest.json
      - name: Full original proof and supplementary theorem verification
        run: python3 scripts/verify_selection.py
      - name: Strict independent checker for all 60 target closures
        run: |
          set -euo pipefail
          bash scripts/verify_selection_nanoda.sh 2>&1 | tee evidence-selection/nanoda-build.log
      - name: Archive exact tested source and evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence-selection
          git rev-parse HEAD > evidence-selection/SOURCE_COMMIT
          git -C ../.. archive HEAD projects/jsp-000506 .github/workflows/jsp-000506-selection.yml | gzip -n > evidence-selection/source.tar.gz
          if test -s Erdos625SelfContained.lean; then gzip -n -c Erdos625SelfContained.lean > evidence-selection/Erdos625SelfContained.lean.gz; fi
          sha256sum evidence-selection/source.tar.gz > evidence-selection/SOURCE_ARCHIVE_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jsp-000506-selection-evidence
          path: |
            projects/jsp-000506/evidence-selection
            projects/jsp-000506/evidence-complete
          if-no-files-found: error
