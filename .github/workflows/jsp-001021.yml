name: JSP-001021 complete proof verification
on:
  push:
    branches: [jsp-001021-tournament-verification]
    paths: ['projects/jsp-001021/**', '.github/workflows/jsp-001021.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jsp-001021-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Certificate reconstruction memory
        run: |
          sudo fallocate -l 10G /swapfile-jsp
          sudo chmod 600 /swapfile-jsp
          sudo mkswap /swapfile-jsp
          sudo swapon /swapfile-jsp
      - name: Install pinned Lean toolchain
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.34.0
      - name: Fetch pinned proof inputs and Mathlib cache
        working-directory: projects/jsp-001021
        run: |
          python3 scripts/bootstrap.py
          lake exe cache get Mathlib.Tactic Mathlib.Combinatorics.SimpleGraph.Clique Mathlib.Tactic.Sat.FromLRAT Mathlib.Data.Finset.Sort Mathlib.Tactic.IntervalCases Mathlib.LinearAlgebra.Matrix.Notation
      - name: Compile, replay and audit the complete proof
        working-directory: projects/jsp-001021
        run: bash scripts/verify.sh
      - name: Record the executed commit
        if: always()
        working-directory: projects/jsp-001021
        run: |
          mkdir -p evidence/generated
          git rev-parse HEAD > evidence/generated/SOURCE_COMMIT
          cp lean-toolchain lake-manifest.json UPSTREAM.json MODULES.json evidence/generated/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jsp-001021-verification
          path: projects/jsp-001021/evidence/generated
          if-no-files-found: error
          retention-days: 90
