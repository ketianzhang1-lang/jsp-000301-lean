name: Research original statements
on:
  push:
    branches: [research-fullscope-20260917]
    paths: ['.github/workflows/research-statements.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download pinned public statements
        run: |
          mkdir -p sources
          python3 - <<'PY'
          import urllib.request, tarfile, io, pathlib
          rev='40e7c98697de6f66b8cbdbf641749ab39ed9c152'
          data=urllib.request.urlopen('https://codeload.github.com/google-deepmind/formal-conjectures/tar.gz/'+rev,timeout=120).read()
          t=tarfile.open(fileobj=io.BytesIO(data),mode='r:gz')
          for m in t.getmembers():
              if '/FormalConjectures/ErdosProblems/' in m.name and m.name.endswith('.lean'):
                  pathlib.Path('sources',pathlib.PurePosixPath(m.name).name).write_bytes(t.extractfile(m).read())
          print('Statements:',len(list(pathlib.Path('sources').iterdir())))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: original-statements
          path: sources
